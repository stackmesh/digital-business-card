services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-business_card}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-business_card}
      POSTGRES_DB: ${POSTGRES_DB:-business_card}
    ports:
      # Host port 5433 avoids a local Postgres already bound to 5432.
      # The API container still connects to postgres:5432 on the Compose network.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      # Production disables the public Apollo Sandbox. This API has no
      # authentication, so the landing page and introspection stay off.
      # GraphQL queries are still served at /graphql.
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-business_card}:${POSTGRES_PASSWORD:-business_card}@postgres:5432/${POSTGRES_DB:-business_card}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
